<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cancel Out 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">

        <div id="stats-header">
            <div class="stat-label">Total</div>
            <div class="stat-value" id="total-count">0</div>
        </div>

        <header id="header">
            <div id="main-equation"></div>
            <div id="numpad" class="hidden">
                <button class="numkey" data-key="0">0</button>
                <button class="numkey" data-key="1">1</button>
                <button class="numkey" data-key="2">2</button>
                <button class="numkey" data-key="3">3</button>
                <button class="numkey" data-key="4">4</button>
                <button class="numkey" data-key="5">5</button>
                <button class="numkey" data-key="6">6</button>
                <button class="numkey" data-key="7">7</button>
                <button class="numkey" data-key="8">8</button>
                <button class="numkey" data-key="9">9</button>
                <button class="numkey numkey-back" data-key="back">⌫</button>
                <button class="numkey numkey-enter" data-key="enter">✓</button>
            </div>
        </header>

        <main id="board"></main>

        <section id="settle-section" class="hidden">
            <div id="settle-message"></div>
            <div id="settle-equation"></div>
        </section>

        <button id="continue-btn" class="btn btn-primary hidden">Next Problem →</button>
    </div>

    <div id="particles-container"></div>
    <script src="script.js"></script>
</body>
</html>
