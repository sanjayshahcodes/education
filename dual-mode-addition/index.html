<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Mode Addition Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="games-completed-counter">Games completed: <span id="games-completed">0</span></div>
        <div id="original-equation-display" class="original-equation-display hidden"></div>
        <button id="next-game-btn" class="next-game-btn hidden">Next Game</button>
    </div>

    <!-- Main Game Container -->
    <div class="dual-game-container">
        <!-- Top: Flexible Combining Method (Mode 4) -->
        <div class="method-container" id="flexible-method">
            <div class="visual-container">
                <div class="equation-container">
                    <button id="swap-numbers-btn" class="swap-numbers-btn hidden">⇄</button>
                    <div id="flexible-equation"></div>
                </div>
                <div id="flexible-confetti-container" class="confetti-container hidden"></div>
            </div>
        </div>

        <!-- Bottom: Numberboard Modal Method (Mode 1) -->
        <div class="method-container" id="numberboard-method">
            <div class="visual-container">
                <div class="equation-container">
                    <div id="numberboard-equation"></div>
                </div>
                <div id="numberboard-confetti-container" class="confetti-container hidden"></div>
            </div>
        </div>
    </div>

    <!-- Modal for Flexible Method -->
    <div id="modal" class="hidden">
        <div class="popup">
            <button id="cancel">✕</button>
            <div id="modal-equation-container">
                <div id="modal-equation"></div>
                <div id="equals-sign">=</div>
                <input id="answer-input" type="text" readonly>
            </div>
            <div id="error-msg" class="hidden">Wrong! Try again.</div>
            <div id="numpad" class="hidden">
                <button class="num-btn">1</button>
                <button class="num-btn">2</button>
                <button class="num-btn">3</button>
                <button class="num-btn">4</button>
                <button class="num-btn">5</button>
                <button class="num-btn">6</button>
                <button class="num-btn">7</button>
                <button class="num-btn">8</button>
                <button class="num-btn">9</button>
                <button class="num-btn">0</button>
                <button id="backspace">←</button>
                <button id="submit">➔</button>
            </div>
            <div id="numberboard" class="hidden">
                <div id="modal-number-grid" class="number-grid">
                    <!-- Numbers 1-100 will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
