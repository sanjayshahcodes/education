<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Odd Even">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f1e3d">

    <title>Odd and Even</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">

        <div id="top-right">
            <button id="continue-btn" class="btn btn-primary">Next Problem →</button>
            <div id="stats-header">
                <div class="stat-block">
                    <div class="stat-label">Total</div>
                    <div class="stat-value" id="total-count">0</div>
                </div>
                <div class="stat-block">
                    <div class="stat-label">Correct</div>
                    <div class="stat-value" id="correct-count">0</div>
                </div>
            </div>
        </div>

        <!-- Just the rule beneath the chrome. The rule the problem
             demonstrates is readable off the pills on the board itself. -->
        <div id="topbar"></div>

        <main id="board">
            <!-- The whole question on one line: the two piles, then the two
                 answers she can pick, where the answer belongs. -->
            <div id="sum-row">
                <div id="terms"></div>
                <div class="op" id="equals">=</div>
                <!-- One slot, two states in the same grid cell: the choices,
                     then the answer itself, drawn like the other two terms. -->
                <div id="answer-slot">
                    <div id="choice-buttons">
                        <button class="choice-btn" data-choice="odd">Odd</button>
                        <button class="choice-btn" data-choice="even">Even</button>
                    </div>
                    <div id="answer-term"></div>
                </div>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
