<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Full-screen when saved to the iPad home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Add">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f1e3d">

    <title>Block Addition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">

        <div id="stats-header">
            <div class="stat-block">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="total-count">0</div>
            </div>
            <div class="stat-block">
                <div class="stat-label">Correct</div>
                <div class="stat-value" id="correct-count">0</div>
            </div>
        </div>

        <header id="header">
            <div id="main-equation"></div>
        </header>

        <main id="board">
            <div id="sum-row"></div>
        </main>

        <div id="caption"></div>

        <footer id="footer">
            <div id="numpad">
                <button class="numkey" data-key="1">1</button>
                <button class="numkey" data-key="2">2</button>
                <button class="numkey" data-key="3">3</button>
                <button class="numkey" data-key="4">4</button>
                <button class="numkey" data-key="5">5</button>
                <button class="numkey" data-key="6">6</button>
                <button class="numkey" data-key="7">7</button>
                <button class="numkey" data-key="8">8</button>
                <button class="numkey" data-key="9">9</button>
                <button class="numkey" data-key="0">0</button>
                <button class="numkey numkey-back" data-key="back">⌫</button>
                <button class="numkey numkey-enter" data-key="enter">✓</button>
            </div>
            <button id="continue-btn" class="btn btn-primary hidden">Next Problem →</button>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
