<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mystery Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Stats sidebar -->
        <div id="stats-header">
            <div id="total-games">
                <div class="stat-label">Total Games</div>
                <div class="stat-value" id="total-count">0</div>
            </div>
        </div>

        <!-- Problem text -->
        <div id="problem-area">
            <div id="problem-text"></div>
        </div>

        <!-- Step 1: Translate sentence to equation (multiple choice) -->
        <div id="step1-area">
            <div id="step1-prompt">Which equation describes this?</div>
            <div id="translate-choices"></div>
        </div>

        <!-- Part-whole diagram (hidden until step 2) -->
        <div id="diagram-area" class="hidden">
            <svg id="diagram-svg" width="540" height="210" viewBox="0 0 540 210">
                <!-- Top arc -->
                <path d="M 30,100 Q 30,35 270,35 Q 510,35 510,100" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
                <!-- Bottom-left arc -->
                <path d="M 30,100 Q 30,180 150,180 Q 270,180 270,100" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
                <!-- Bottom-right arc -->
                <path d="M 270,100 Q 270,180 390,180 Q 510,180 510,100" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
                <!-- Horizontal bar -->
                <line x1="30" y1="100" x2="510" y2="100" stroke="rgba(255,255,255,0.85)" stroke-width="3"/>
                <!-- Left end cap -->
                <line x1="30" y1="88" x2="30" y2="112" stroke="rgba(255,255,255,0.85)" stroke-width="3"/>
                <!-- Right end cap -->
                <line x1="510" y1="88" x2="510" y2="112" stroke="rgba(255,255,255,0.85)" stroke-width="3"/>
                <!-- Center tick -->
                <line x1="270" y1="88" x2="270" y2="112" stroke="rgba(255,255,255,0.85)" stroke-width="3"/>

                <!-- Whole circle -->
                <foreignObject x="237" y="2" width="66" height="66">
                    <div xmlns="http://www.w3.org/1999/xhtml" id="whole-circle" class="diagram-circle empty" data-circle="whole">
                        <span class="circle-label">?</span>
                    </div>
                </foreignObject>
                <!-- Part-left circle -->
                <foreignObject x="117" y="147" width="66" height="66">
                    <div xmlns="http://www.w3.org/1999/xhtml" id="part-left" class="diagram-circle empty" data-circle="partLeft">
                        <span class="circle-label">?</span>
                    </div>
                </foreignObject>
                <!-- Part-right circle -->
                <foreignObject x="357" y="147" width="66" height="66">
                    <div xmlns="http://www.w3.org/1999/xhtml" id="part-right" class="diagram-circle empty" data-circle="partRight">
                        <span class="circle-label">?</span>
                    </div>
                </foreignObject>
            </svg>
        </div>

        <!-- Step 2: Check diagram button -->
        <div id="step2-area" class="hidden">
            <button id="step2-check" class="action-btn" disabled>Check</button>
        </div>

        <!-- Step 3: Equation builder for S = ___ -->
        <div id="step3-area" class="hidden">
            <div id="step3-prompt">Build the equation for S</div>
            <div id="equation-builder">
                <span class="builder-label">S =</span>
                <div class="builder-slot" data-slot="num1">
                    <span class="slot-label"></span>
                </div>
                <div class="builder-slot operator-slot" data-slot="operator">
                    <span class="slot-label"></span>
                </div>
                <div class="builder-slot" data-slot="num2">
                    <span class="slot-label"></span>
                </div>
            </div>
            <button id="step3-check" class="action-btn" disabled>Check</button>
        </div>

        <!-- Step 4: Number pad solve -->
        <div id="step4-area" class="hidden">
            <div id="step4-prompt">Solve for S</div>
            <div id="playback-area" class="hidden">
                <div id="playback-equation"></div>
                <div id="playback-mark"></div>
            </div>
            <div id="answer-display">?</div>
            <div id="number-pad">
                <button class="pad-btn" data-value="1">1</button>
                <button class="pad-btn" data-value="2">2</button>
                <button class="pad-btn" data-value="3">3</button>
                <button class="pad-btn" data-value="4">4</button>
                <button class="pad-btn" data-value="5">5</button>
                <button class="pad-btn" data-value="6">6</button>
                <button class="pad-btn" data-value="7">7</button>
                <button class="pad-btn" data-value="8">8</button>
                <button class="pad-btn" data-value="9">9</button>
                <button class="pad-btn backspace" data-value="backspace">&larr;</button>
                <button class="pad-btn" data-value="0">0</button>
                <button class="pad-btn enter" data-value="enter">GO</button>
            </div>
        </div>

        <!-- Value picker popup -->
        <div id="picker-overlay" class="hidden">
            <div id="value-picker">
                <div class="picker-title">Choose a value</div>
                <div id="picker-options"></div>
            </div>
        </div>

        <!-- Feedback overlay -->
        <div id="feedback-overlay" class="hidden">
            <div id="feedback-message"></div>
        </div>

        <!-- Celebration particles -->
        <div id="particles-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
