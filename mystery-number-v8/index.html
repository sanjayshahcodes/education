<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mystery Number v8</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Stats sidebar -->
        <div id="stats-header">
            <div id="total-games">
                <div class="stat-label">Total Games</div>
                <div class="stat-value" id="total-count">0</div>
            </div>
        </div>

        <!-- Equation (replaces v6's word problem + step1 translate) -->
        <div id="equation-area">
            <div id="equation-display"></div>
        </div>

        <!-- Part-whole diagram (hidden until step 2) — SVG generated dynamically -->
        <div id="diagram-area" class="hidden">
            <svg id="diagram-svg"></svg>
        </div>

        <!-- Step 2: Check diagram button -->
        <div id="step2-area" class="hidden">
            <div id="step2-prompt">Fill in the diagram</div>
            <button id="step2-check" class="action-btn" disabled>Check</button>
        </div>

        <!-- Step 3: Equation builder for x = ___ -->
        <div id="step3-area" class="hidden">
            <div id="step3-prompt">Build the equation for x</div>
            <div id="equation-builder">
                <span class="builder-label">x =</span>
                <div class="builder-slot" data-slot="num1">
                    <span class="slot-label"></span>
                </div>
                <div class="builder-slot operator-slot" data-slot="operator">
                    <span class="slot-label"></span>
                </div>
                <div class="builder-slot" data-slot="num2">
                    <span class="slot-label"></span>
                </div>
            </div>
            <button id="step3-check" class="action-btn" disabled>Check</button>
        </div>

        <!-- Step 4: Number pad solve -->
        <div id="step4-area" class="hidden">
            <div id="step4-prompt">Solve for x</div>
            <div id="playback-area" class="hidden">
                <div id="playback-equation"></div>
                <div id="playback-mark"></div>
            </div>
            <div id="answer-display">?</div>
            <div id="number-pad">
                <button class="pad-btn" data-value="1">1</button>
                <button class="pad-btn" data-value="2">2</button>
                <button class="pad-btn" data-value="3">3</button>
                <button class="pad-btn" data-value="4">4</button>
                <button class="pad-btn" data-value="5">5</button>
                <button class="pad-btn" data-value="6">6</button>
                <button class="pad-btn" data-value="7">7</button>
                <button class="pad-btn" data-value="8">8</button>
                <button class="pad-btn" data-value="9">9</button>
                <button class="pad-btn backspace" data-value="backspace">&larr;</button>
                <button class="pad-btn" data-value="0">0</button>
                <button class="pad-btn enter" data-value="enter">GO</button>
            </div>
        </div>

        <!-- Value picker popup -->
        <div id="picker-overlay" class="hidden">
            <div id="value-picker">
                <div class="picker-title">Choose a value</div>
                <div id="picker-options"></div>
            </div>
        </div>

        <!-- Feedback overlay -->
        <div id="feedback-overlay" class="hidden">
            <div id="feedback-message"></div>
        </div>

        <!-- Celebration particles -->
        <div id="particles-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
