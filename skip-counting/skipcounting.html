<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skip Counting Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <button id="next-game-btn" class="next-game-btn hidden">Next Game</button>
        
        <div class="game-board">
            <div class="game-sidebar">
                <div class="game-info">
                    <div class="skip-info">Skip by: <span id="skip-value">2</span></div>
                    <div class="progress">Games completed: <span id="games-completed">0</span></div>
                </div>
            </div>
            <div id="number-grid" class="number-grid">
                <!-- Numbers 1-100 will be generated by JavaScript -->
            </div>
        </div>
    </div>
    
    <!-- Confetti container -->
    <div id="confetti-container" class="confetti-container hidden"></div>
    
    <script src="script.js"></script>
</body>
</html>
