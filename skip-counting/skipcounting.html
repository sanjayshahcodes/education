<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skip Counting Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <button id="next-game-btn" class="next-game-btn hidden">Next Game</button>
        
        <div class="game-board">
            <div class="game-sidebar">
                <div class="game-info">
                    <div class="progress">Games completed: <span id="games-completed">0</span></div>
                </div>
            </div>
            <!-- Grid Mode -->
            <div id="grid-mode" class="grid-container">
                <div class="skip-reminder">Skip by: <span id="skip-value">2</span></div>
                <div id="number-grid" class="number-grid">
                    <!-- Numbers 1-100 will be generated by JavaScript -->
                </div>
            </div>
            
            <!-- Sequence Mode -->
            <div id="sequence-mode" class="sequence-container hidden">
                <div class="skip-reminder">Skip by: <span id="skip-value-sequence">2</span></div>
                <div class="sequence-display" id="sequence-display">
                    <!-- Sequence circles will be generated by JavaScript -->
                </div>
                <div class="number-pad">
                    <div class="number-pad-grid">
                        <button class="number-btn" data-number="1">1</button>
                        <button class="number-btn" data-number="2">2</button>
                        <button class="number-btn" data-number="3">3</button>
                        <button class="number-btn" data-number="4">4</button>
                        <button class="number-btn" data-number="5">5</button>
                        <button class="number-btn" data-number="6">6</button>
                        <button class="number-btn" data-number="7">7</button>
                        <button class="number-btn" data-number="8">8</button>
                        <button class="number-btn" data-number="9">9</button>
                        <button class="number-btn clear-btn" data-number="clear">←</button>
                        <button class="number-btn" data-number="0">0</button>
                        <button class="number-btn enter-btn" data-number="enter">→</button>
                    </div>

                </div>
            </div>
        </div>
    </div>
    
    <!-- Confetti container -->
    <div id="confetti-container" class="confetti-container hidden"></div>
    
    <script src="script.js"></script>
</body>
</html>
