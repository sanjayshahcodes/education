<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lollipop Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">

        <div id="stats-header">
            <div class="stat-label">Total</div>
            <div class="stat-value" id="total-count">0</div>
        </div>

        <header id="header">
            <div id="main-equation"></div>
            <div id="phase-prompt">
                <div class="phase-step hidden" id="step-add"></div>
                <div class="phase-step hidden" id="step-remove"></div>
            </div>
        </header>

        <div id="start-section">
            <button id="start-btn" class="btn btn-primary">Start</button>
        </div>

        <main id="board" class="hidden">
            <section class="card pile-card">
                <div class="add-tally hidden" id="add-tally">+0</div>
                <div class="pile-split">
                    <div class="compartment compartment-orig">
                        <div class="compartment-body" id="original-body"></div>
                        <div class="compartment-count orig-count" id="orig-count">0</div>
                    </div>
                    <div class="compartment compartment-added" id="added-compartment">
                        <div class="compartment-body" id="added-body"></div>
                        <div class="compartment-count added-count" id="added-count">0</div>
                    </div>
                </div>
            </section>

            <section class="card supply-card" id="supply-card">
                <div class="supply-body" id="supply-body">
                    <div class="supply-tile" id="supply-stack" data-amount="5">
                        <div class="supply-stack-visual">
                            <span class="lp">🍭</span>
                            <span class="lp">🍭</span>
                            <span class="lp">🍭</span>
                            <span class="lp">🍭</span>
                            <span class="lp">🍭</span>
                        </div>
                    </div>
                    <div class="supply-tile" id="supply-single" data-amount="1">
                        <div class="supply-stack-visual">
                            <span class="lp">🍭</span>
                        </div>
                    </div>
                </div>
                <div class="bin hidden" id="bin">
                    <div class="bin-icon">🗑️</div>
                    <div class="bin-label">drop here</div>
                </div>
            </section>
        </main>

        <div id="action-row"></div>

        <section id="settle-section" class="hidden">
            <div id="settle-message"></div>
            <div id="settle-equation"></div>
        </section>

        <button id="continue-btn" class="btn btn-primary hidden">Next Problem →</button>
    </div>

    <div id="particles-container"></div>
    <script src="script.js"></script>
</body>
</html>
