<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Performance Test</title>
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            touch-action: manipulation;
            -webkit-text-size-adjust: none;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            flex-direction: column;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        #equation {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 20px;
        }

        .number-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            position: relative;
            cursor: pointer;
        }

        .number-value {
            background-color: lightblue;
            border: 2px solid #333;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #333;
            transition: all 0.2s ease;
        }

        .number-circle.dragging {
            opacity: 0.7;
            z-index: 1000;
        }

        .number-circle.dragging .number-value {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .number-circle.drag-target {
            transform: scale(1.05);
            transition: all 0.2s ease;
        }

        .number-circle.drag-target .number-value {
            border: 3px dashed #999;
            transition: all 0.2s ease;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</head>
<body>
    <div id="equation"></div>
    
    <script>
        let currentNumbers = [47, 35];
        let droppedFlag = false;
        
        function renderEquation() {
            const equationDiv = document.getElementById('equation');
            equationDiv.innerHTML = '';
            
            currentNumbers.forEach((num, idx) => {
                if (idx > 0) {
                    const plus = document.createElement('div');
                    plus.textContent = '+';
                    plus.style.margin = '0 10px';
                    plus.style.fontSize = '48px';
                    equationDiv.appendChild(plus);
                }
                
                const circle = document.createElement('div');
                circle.className = 'number-circle';
                
                const numberValue = document.createElement('div');
                numberValue.className = 'number-value';
                numberValue.textContent = num;
                
                circle.appendChild(numberValue);
                equationDiv.appendChild(circle);
            });
        }
        
        function resetPosition(element) {
            element.style.transform = '';
            element.setAttribute('data-x', 0);
            element.setAttribute('data-y', 0);
        }
        
        function makeDraggable() {
            // Make numbers draggable - EXACT copy from original
            interact('.number-circle')
                .draggable({
                    inertia: false,
                    autoScroll: false,
                    listeners: {
                        start(event) {
                            droppedFlag = false;
                            event.target.setAttribute('data-x', 0);
                            event.target.setAttribute('data-y', 0);
                            event.target.style.transform = 'scale(1.1)';
                            event.target.style.zIndex = '1000';
                            event.target.classList.add('dragging');
                        },
                        move(event) {
                            const target = event.target;
                            const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                            const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
                            target.style.transform = `translate(${x}px, ${y}px) scale(1.1)`;
                            target.setAttribute('data-x', x);
                            target.setAttribute('data-y', y);
                        },
                        end(event) {
                            event.target.style.transform = '';
                            event.target.style.zIndex = '';
                            event.target.classList.remove('dragging');
                            if (!droppedFlag) {
                                resetPosition(event.target);
                            }
                        }
                    }
                });

            // Add double-click to split numbers - EXACT copy from original
            document.querySelectorAll('.number-circle').forEach(circle => {
                circle.addEventListener('dblclick', function(event) {
                    event.preventDefault();
                    const num = parseInt(this.querySelector('.number-value').textContent);
                    const idx = currentNumbers.indexOf(num);
                    if (idx !== -1) {
                        const tens = Math.floor(num / 10) * 10;
                        const ones = num % 10;
                        if (tens > 0 && ones > 0) {
                            currentNumbers.splice(idx, 1, tens, ones);
                            renderEquation();
                            makeDraggable();
                        }
                    }
                });
            });

            // Make numbers dropzones - EXACT copy from original
            interact('.number-circle').dropzone({
                accept: '.number-circle',
                overlap: 'pointer',
                ondragenter: function(event) {
                    event.target.classList.add('drag-target');
                },
                ondragleave: function(event) {
                    event.target.classList.remove('drag-target');
                },
                ondrop: function(event) {
                    event.target.classList.remove('drag-target');
                    droppedFlag = true;
                    console.log('Drop detected!');
                }
            });
        }
        
        // Initialize
        renderEquation();
        makeDraggable();
    </script>
</body>
</html>
